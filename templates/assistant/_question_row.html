<div data-question-row class="mt-3 flex flex-wrap items-end gap-2">
  <label class="min-w-0 flex-1 text-xs">Question<input class="workspace-input mt-1 w-full" name="custom_question" maxlength="160" value="{{ mapping.question }}" placeholder="e.g. How are this month's sales?" required></label>
  <label class="min-w-0 flex-1 text-xs">Answer from<select class="workspace-input mt-1 w-full" name="custom_report">{% for report in report_choices %}<option value="{{ report.key }}" {% if report.key == mapping.report %}selected{% endif %}>{{ report.label }}</option>{% endfor %}</select></label>
  <button type="button" class="workspace-action" data-remove-question>Remove question</button>
</div>
