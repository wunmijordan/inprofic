{% if product_id and module_permissions.inventory.view %}<a href="{% url 'product_detail' product_id %}{% if product_start %}?start={{ product_start|date:'Y-m-d' }}&amp;end={{ product_end|date:'Y-m-d' }}{% endif %}" class="font-medium underline decoration-dotted underline-offset-4 hover:decoration-solid" aria-label="View product {{ product_name }}">{{ product_name }}</a>{% else %}{{ product_name }}{% endif %}
