{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl">
  <div class="flex items-start justify-between gap-3 mb-4">
    <div><h2 class="text-xl font-semibold font-display text-[#8f172d]">{{ title }}</h2><p class="text-sm text-stone-500 mt-1">{{ intro }}</p></div>
    <a href="{% url 'market_stock' %}" class="text-sm text-[#8f172d] hover:underline">Market Stock</a>
  </div>
  <form method="post" class="cf-form-shell cf-form-body space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ form.non_field_errors }}</div>{% endif %}
    {% for field in form %}{% include "_field.html" with field=field %}{% endfor %}
    <div class="flex gap-2 pt-2"><a href="{% url 'market_stock' %}" class="px-3.5 py-2 text-sm rounded-md text-stone-500 hover:bg-stone-100">Cancel</a><button class="px-3.5 py-2 text-sm rounded-md font-medium bg-[#8f172d] text-white">{{ submit_label }}</button></div>
  </form>
</div>
{% endblock %}
