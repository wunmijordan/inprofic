{% extends "base.html" %}
{% block content %}<div class="mx-auto max-w-xl"><div class="mb-5"><p class="text-[11px] font-bold uppercase tracking-[.18em] text-stone-400">Inventory setup</p><h2 class="mt-1 text-2xl font-semibold font-display text-[#8f172d]">Edit Product Category</h2></div><form method="post" class="rounded-xl border border-[#E7DFCC] bg-white p-5 space-y-3">{% csrf_token %}{% for field in form %}{% include "_field.html" with field=field %}{% endfor %}<div class="flex justify-end gap-2"><a href="{% url 'product_categories' %}" class="px-3 py-2 text-sm text-stone-500">Cancel</a><button class="rounded-md bg-[#8f172d] px-3 py-2 text-sm font-semibold text-white">Save category</button></div></form></div>{% endblock %}
