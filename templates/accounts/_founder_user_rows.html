{% for account in platform_users %}
<tr>
  <td class="border-t px-3 py-2"><div class="font-medium">{{ account.fullname|default:account.username }}</div><div class="text-xs text-stone-500">{{ account.username }}{% if account.is_superuser %} · Superuser{% elif not account.is_active %} · Paused{% endif %}</div></td>
  <td class="border-t px-3 py-2 text-center font-mono">{{ account.business_count }}</td>
  <td class="border-t px-3 py-2"><div class="flex justify-end gap-2"><a href="{% url 'founder_platform_user' account.pk %}" class="rounded-md border border-stone-300 bg-white px-2.5 py-1.5 text-xs font-semibold">Edit</a><a href="{% url 'founder_platform_user_delete' account.pk %}" class="rounded-md border border-rose-300 bg-rose-50 px-2.5 py-1.5 text-xs font-semibold text-rose-700">Delete</a></div></td>
</tr>
{% empty %}
<tr><td colspan="3" class="p-5 text-center text-stone-500">No matching users.</td></tr>
{% endfor %}
