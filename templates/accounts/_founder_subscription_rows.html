{% for s in subscriptions %}<tr class="border-t"><td class="p-2">{{ s.primary_business.name }}</td><td class="text-center">{{ s.plan.name }}</td><td class="text-center">{{ s.effective_status_label }}</td><td class="text-center">{{ s.services.count }}</td><td class="text-center">{% if s.founder_lifetime %}Lifetime <form method="post" class="inline">{% csrf_token %}<input type="hidden" name="subscription_id" value="{{ s.pk }}"><button name="action" value="revoke_founder" class="ml-1 text-[10px] text-rose-700 underline">revoke</button></form>{% elif s.expires_at %}{{ s.expires_at|date:"j M Y" }}{% else %}—{% endif %}</td></tr>{% empty %}<tr><td colspan="5" class="p-4 text-center text-stone-500">No subscriptions yet.</td></tr>{% endfor %}
