{% extends "base.html" %}
{% block content %}
<section class="mx-auto max-w-xl rounded-2xl border border-amber-200 bg-amber-50 p-5 text-amber-950">
  <p class="text-[10px] font-bold uppercase tracking-[0.18em]">Ledger date check</p>
  <h1 class="mt-2 text-lg font-semibold">This date belongs to another ledger period</h1>
  <p class="mt-2 text-sm">{{ error.message }}</p>
  <div class="mt-4 flex flex-wrap gap-2">
    {% if backlog_entry_allowed and request.ledger_scope != 'backlog' %}<form method="post" action="{% url 'ledger_mode' %}">{% csrf_token %}<input type="hidden" name="mode" value="backlog"><input type="hidden" name="next" value="{% url 'ledger_workspace' %}"><button class="rounded-xl bg-[#8f172d] px-4 py-2 text-xs font-semibold text-white">Switch to Backlog entry</button></form>{% endif %}
    <a href="{% url 'dashboard' %}" class="rounded-xl border border-amber-300 bg-white px-4 py-2 text-xs font-semibold">Return to dashboard</a>
  </div>
</section>
{% endblock %}
