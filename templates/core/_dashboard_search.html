<style>
  [x-cloak] { display: none !important; }
  .dashboard-surface { border: 1px solid var(--ui-border); background: var(--ui-surface); box-shadow: var(--ui-shadow); }
  /* Search results follow the active theme: surface, divider, hover and chip all come from tokens. */
  .dashboard-search-menu { border: 1px solid var(--ui-border); background: var(--ui-surface) !important; }
  .dashboard-search-result { border-bottom: 1px solid var(--ui-border); background: transparent; color: var(--ui-surface-text); }
  .dashboard-search-result .text-stone-800 { color: var(--ui-surface-text) !important; }
  .dashboard-search-result .text-stone-400, .dashboard-search-result .text-stone-500 { color: var(--ui-surface-muted-text) !important; }
  .dashboard-search-result:last-child { border-bottom: 0; }
  .dashboard-search-result:hover, .dashboard-search-result:focus-visible { background: color-mix(in srgb, var(--ui-accent) 14%, var(--ui-surface-muted)) !important; }
  .dashboard-search-chip { background: var(--ui-surface-muted) !important; color: var(--ui-surface-text) !important; border: 1px solid var(--ui-border); }
</style>
<!-- Shared global search for both dashboard views. -->
<div data-tour-target="search" x-data="dashboardSearch()" class="relative mb-4">
  <div class="dashboard-surface rounded-2xl p-3 md:p-4">
    <div class="flex items-center gap-3">
      <div class="shrink-0 text-[#8f172d]">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <input
          x-model="query"
          @input.debounce.250ms="search()"
          @keydown.escape="closeResults()"
          @keydown.enter.prevent="openFirst()"
          type="search"
          autocomplete="off"
          placeholder="Search anything — Material, Product, Vendor, Customer…"
          class="w-full border-0 bg-transparent p-0 text-sm text-stone-800 placeholder:text-stone-400 focus:ring-0 outline-none"
        >
      </div>
      <button x-show="query" @click="clear()" type="button" class="shrink-0 text-stone-400 hover:text-stone-700 text-lg leading-none">&times;</button>
    </div>
  </div>

  <!-- Search result dropdown -->
  <div x-show="showResults && (results.length || loading || (query.length >= 2 && !loading))" x-cloak
       class="dashboard-search-menu absolute left-0 right-0 top-full mt-2 z-40 max-h-[60vh] overflow-y-auto rounded-2xl shadow-2xl">
    <div x-show="loading" class="px-4 py-3 text-xs text-stone-400">Searching the system…</div>
    <template x-for="result in results" :key="result.key">
      <button type="button" @click="open(result)" class="dashboard-search-result group w-full text-left px-4 py-3 focus:outline-none transition">
        <div class="flex items-center justify-between gap-3">
          <span class="font-semibold text-sm text-stone-800 truncate" x-text="result.label"></span>
          <span class="dashboard-search-chip shrink-0 text-[10px] font-semibold uppercase tracking-wide px-2 py-1 rounded-full" x-text="result.identifier"></span>
        </div>
        <div class="text-[11px] text-stone-400 mt-0.5" x-text="result.meta"></div>
      </button>
    </template>
    <div x-show="!loading && !results.length && query.length >= 2" class="px-4 py-5 text-center text-xs text-stone-400">No matching object found.</div>
  </div>

  <!-- Search detail modal -->
  <div x-show="detail" x-cloak x-transition.opacity class="fixed inset-0 z-[60] bg-stone-950/55 backdrop-blur-sm p-0 sm:p-4 md:p-6 flex items-end sm:items-center justify-center" @keydown.escape.window="closeDetail()">
    <div @click.away="closeDetail()" role="dialog" aria-modal="true" class="st-modal-surface bg-[#FAF6EF] border border-stone-200 rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-5xl max-h-[94dvh] overflow-hidden flex flex-col">
      <div class="px-4 py-4 md:px-6 border-b border-[#E7DFCC] bg-white flex items-start justify-between gap-4">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <span class="text-[10px] font-bold uppercase tracking-wider text-[#8f172d] bg-[#E8F0EB] px-2 py-1 rounded-full" x-text="detail?.type"></span>
            <span class="text-[10px] font-semibold uppercase tracking-wider text-stone-500 bg-stone-100 px-2 py-1 rounded-full" x-text="detail?.identifier"></span>
          </div>
          <h3 class="text-xl font-semibold font-display text-[#8f172d] truncate" x-text="detail?.title"></h3>
        </div>
        <button @click="closeDetail()" type="button" class="shrink-0 grid h-9 w-9 place-items-center rounded-full bg-stone-100 text-stone-500 hover:bg-stone-200 hover:text-stone-800 text-xl leading-none" aria-label="Close search detail">&times;</button>
      </div>

      <nav class="shrink-0 flex gap-1 overflow-x-auto overflow-y-hidden border-b border-[#E7DFCC] bg-white px-4 md:px-6" role="tablist" aria-label="Search detail sections">
        <template x-for="tab in detailTabs()" :key="tab.key">
          <button type="button" role="tab" :aria-selected="detailTab === tab.key ? 'true' : 'false'" @click="detailTab = tab.key" class="whitespace-nowrap border-b-2 border-transparent px-3 py-3 text-xs font-semibold transition" x-text="tab.label"></button>
        </template>
      </nav>

      <div class="overflow-y-auto p-4 md:p-6">
        <!-- Summary -->
        <div x-show="detailTab === 'overview'" x-transition.opacity class="grid grid-cols-2 md:grid-cols-4 gap-2" >
          <template x-for="card in summaryCards()" :key="card.label">
            <div class="bg-white border border-[#E7DFCC] rounded-xl p-3 md:p-4 min-w-0 shadow-sm">
              <div class="text-[10px] uppercase tracking-wide font-bold text-stone-400" x-text="card.label"></div>
              <div class="text-sm md:text-base font-semibold font-mono text-[#8f172d] mt-1 break-words" x-text="card.value"></div>
            </div>
          </template>
        </div>

        <!-- Period analytics -->
        <section x-show="detailTab === 'activity' && detail?.periods?.length" x-transition.opacity class="bg-white border border-[#E7DFCC] rounded-2xl overflow-hidden">
          <div class="px-4 py-3 border-b border-[#E7DFCC]">
            <h4 class="text-xs uppercase tracking-wider font-bold text-[#8f172d]">Period performance</h4>
            <p class="text-[10px] text-stone-400 mt-0.5" x-text="detail?.type === 'Raw material' || detail?.type === 'Procurement vendor' ? 'Procurement activity and procurement-price movement inside each reporting window.' : 'Operational activity and historical financial performance inside each reporting window.'"></p>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs min-w-[620px]">
              <thead class="bg-stone-50 text-stone-500">
                <tr>
                  <th class="px-3 py-2 text-left">Period</th>
                  <th class="px-3 py-2 text-right">Events</th>
                  <th class="px-3 py-2 text-right">Qty / Units</th>
                  <th x-show="detail?.type === 'Finished good'" class="px-3 py-2 text-right">Surplus / excess allocation</th>
                  <th x-show="detail?.type === 'Raw material' || detail?.type === 'Procurement vendor'" class="px-3 py-2 text-right">Spend</th>
                  <th x-show="detail?.type === 'Finished good' || detail?.type === 'Customer'" class="px-3 py-2 text-right">Revenue</th>
                  <th x-show="detail?.type === 'Raw material' || detail?.type === 'Procurement vendor'" class="px-3 py-2 text-right">Procurement price Δ</th>
                  <th x-show="detail?.type === 'Finished good' || detail?.type === 'Customer'" class="px-3 py-2 text-right">Gross margin</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in detail.periods" :key="row.label">
                  <tr class="border-t border-stone-100">
                    <td class="px-3 py-2 font-semibold text-stone-700" x-text="row.label"></td>
                    <td class="px-3 py-2 text-right font-mono" x-text="row.events ?? row.purchase_count ?? row.sale_events ?? row.production_events ?? 0"></td>
                    <td class="px-3 py-2 text-right font-mono" x-text="fmt(row.purchased_qty ?? row.produced_units ?? row.sold_units ?? row.units ?? row.consumed_qty ?? 0)"></td>
                    <td x-show="detail?.type === 'Finished good'" class="px-3 py-2 text-right font-mono"><span class="inline-flex items-center justify-end gap-1.5"><span x-text="Number(row.excess_units || 0) > 0 ? (fmt(row.excess_units) + ' total') : '—'"></span><span class="form-help-tip normal-case tracking-normal" data-form-help-tip data-form-help-portal="true" x-show="Number(row.excess_units || 0) > 0"><button type="button" class="form-help-tip__trigger" data-form-help-trigger aria-label="Surplus breakdown" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8"></circle><path d="M10 9v5"></path><path d="M10 6.25h.01"></path></svg></button><span class="form-help-tip__bubble form-help-tip__bubble--portal normal-case tracking-normal" data-form-help-bubble role="tooltip" hidden><ul class="form-help-tip__list"><template x-for="(line, i) in excessLines(row)" :key="i"><li class="form-help-tip__list-item"><span class="form-help-tip__list-detail" x-text="line"></span></li></template></ul></span></span></span></td>
                    <td x-show="detail?.type === 'Raw material' || detail?.type === 'Procurement vendor'" class="px-3 py-2 text-right font-mono" x-text="money(row.spend ?? 0)"></td>
                    <td x-show="detail?.type === 'Finished good' || detail?.type === 'Customer'" class="px-3 py-2 text-right font-mono" x-text="money(row.revenue ?? 0)"></td>
                    <td x-show="detail?.type === 'Raw material' || detail?.type === 'Procurement vendor'" class="px-3 py-2 text-right font-mono" x-text="row.price_difference !== null && row.price_difference !== undefined ? ((row.price_difference > 0 ? '+' : '') + money(row.price_difference) + (row.price_difference_pct !== null && row.price_difference_pct !== undefined ? ' (' + (row.price_difference_pct > 0 ? '+' : '') + fmt(row.price_difference_pct) + '%)' : '')) : '—'"></td>
                    <td x-show="detail?.type === 'Finished good' || detail?.type === 'Customer'" class="px-3 py-2 text-right font-mono" x-text="row.gross_profit !== undefined ? (money(row.gross_profit) + (row.gross_margin_pct !== null && row.gross_margin_pct !== undefined ? ' (' + fmt(row.gross_margin_pct) + '%)' : '')) : '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <!-- Product profitability (finished goods) -->
        <section x-show="detailTab === 'profit' && detail?.profitability" x-transition.opacity class="space-y-4">
          <div class="flex flex-wrap gap-1 rounded-lg bg-[#F5EFE0] border border-[#E7DFCC] p-1 w-fit" role="group" aria-label="Profitability period">
            <template x-for="(w, index) in (detail?.profitability?.windows || [])" :key="w.label">
              <button type="button" @click="profitWindow = index" class="px-3 py-1.5 text-[11px] rounded-md" :class="profitWindow === index ? 'bg-[#8f172d] text-white' : 'text-stone-600 hover:bg-[#4D1C25] hover:text-white'" :aria-pressed="profitWindow === index" x-text="w.label"></button>
            </template>
          </div>
          <template x-if="currentProfitWindow()">
            <div class="space-y-4">
              <div class="bg-white border border-[#E7DFCC] rounded-2xl p-4">
                <div class="flex flex-wrap items-center gap-2 mb-1">
                  <template x-for="badge in currentProfitWindow().badges" :key="badge"><span class="rounded-full px-2 py-0.5 text-[10px] font-semibold" :class="['Best seller','Top earner'].includes(badge) ? 'bg-emerald-100 text-emerald-800' : (badge === 'Loss-making' ? 'bg-rose-100 text-rose-800' : (['Low margin','Cost not recorded'].includes(badge) ? 'bg-amber-100 text-amber-800' : 'bg-stone-100 text-stone-600'))" x-text="badge"></span></template>
                  <span class="text-[11px] text-stone-400" x-text="currentProfitWindow().span"></span>
                </div>
                <p class="text-sm text-stone-600" x-text="currentProfitWindow().verdict"></p>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                <div class="bg-white border border-[#E7DFCC] rounded-xl p-3"><div class="text-[10px] uppercase tracking-wide font-bold text-stone-400">Units sold</div><div class="font-mono font-semibold mt-1" x-text="fmt(currentProfitWindow().units)"></div></div>
                <div class="bg-white border border-[#E7DFCC] rounded-xl p-3"><div class="text-[10px] uppercase tracking-wide font-bold text-stone-400">Sales</div><div class="font-mono font-semibold mt-1" x-text="money(currentProfitWindow().revenue)"></div></div>
                <div class="bg-white border border-[#E7DFCC] rounded-xl p-3"><div class="text-[10px] uppercase tracking-wide font-bold text-stone-400">Cost of goods</div><div class="font-mono font-semibold mt-1" x-text="money(currentProfitWindow().cogs)"></div></div>
                <div class="bg-white border border-[#E7DFCC] rounded-xl p-3"><div class="text-[10px] uppercase tracking-wide font-bold text-stone-400" x-text="currentProfitWindow().profit < 0 ? 'Loss' : 'Profit'"></div><div class="font-mono font-semibold mt-1" :class="currentProfitWindow().profit < 0 ? 'text-rose-700' : 'text-emerald-700'" x-text="signedMoney(currentProfitWindow().profit)"></div><div class="text-[10px] text-stone-400" x-text="currentProfitWindow().margin !== null ? currentProfitWindow().margin + '% margin' : ''"></div></div>
              </div>
              <div class="bg-white border border-[#E7DFCC] rounded-2xl p-4">
                <h4 class="text-xs uppercase tracking-wider font-bold text-[#8f172d] mb-3">Cost build-up per unit <span class="font-normal normal-case text-stone-400">(current prices)</span></h4>
                <div class="flex h-2.5 w-full overflow-hidden rounded-full bg-stone-100 mb-3" x-show="detail.profitability.build.total > 0">
                  <span :style="`width:${detail.profitability.build.total ? (detail.profitability.build.raw_material + detail.profitability.build.purchase) / detail.profitability.build.total * 100 : 0}%`" class="bg-amber-500"></span>
                  <span :style="`width:${detail.profitability.build.total ? detail.profitability.build.production / detail.profitability.build.total * 100 : 0}%`" class="bg-violet-500"></span>
                </div>
                <dl class="grid grid-cols-2 md:grid-cols-5 gap-3 text-xs">
                  <div x-show="detail.profitability.build.basis === 'recipe'"><dt class="text-stone-400">Raw materials</dt><dd class="font-mono font-semibold mt-0.5" x-text="money(detail.profitability.build.raw_material)"></dd></div>
                  <div x-show="detail.profitability.build.basis === 'recipe'"><dt class="text-stone-400">Production materials</dt><dd class="font-mono font-semibold mt-0.5" x-text="money(detail.profitability.build.production)"></dd></div>
                  <div x-show="detail.profitability.build.basis !== 'recipe'"><dt class="text-stone-400">Purchase cost</dt><dd class="font-mono font-semibold mt-0.5" x-text="money(detail.profitability.build.purchase)"></dd></div>
                  <div><dt class="text-stone-400">Total cost</dt><dd class="font-mono font-semibold mt-0.5" x-text="money(detail.profitability.build.total)"></dd></div>
                  <div><dt class="text-stone-400">Selling price</dt><dd class="font-mono font-semibold mt-0.5" x-text="money(detail.profitability.price)"></dd></div>
                  <div><dt class="text-stone-400">Margin / unit</dt><dd class="font-mono font-semibold mt-0.5" :class="detail.profitability.margin_per_unit < 0 ? 'text-rose-700' : 'text-emerald-700'" x-text="signedMoney(detail.profitability.margin_per_unit) + (detail.profitability.margin_pct !== null ? ' · ' + detail.profitability.margin_pct + '%' : '')"></dd></div>
                </dl>
                <p class="mt-3 text-[11px] text-stone-400" x-show="currentProfitWindow().avg_cost !== null">Actually sold at an average <span class="font-mono" x-text="money(currentProfitWindow().avg_price)"></span> with a recorded cost of <span class="font-mono" x-text="money(currentProfitWindow().avg_cost)"></span> per unit in this period.</p>
              </div>
              <div class="bg-white border border-[#E7DFCC] rounded-2xl p-4">
                <h4 class="text-xs uppercase tracking-wider font-bold text-[#8f172d] mb-3">Profit by month</h4>
                <div class="space-y-1.5">
                  <template x-for="m in detail.profitability.trend" :key="m.label">
                    <div class="flex items-center gap-3 text-xs"><span class="w-8 shrink-0 text-stone-500" x-text="m.label"></span>
                      <span class="relative h-2.5 flex-1 rounded bg-stone-100"><span class="absolute inset-y-0 left-0 rounded" :class="m.profit < 0 ? 'bg-rose-500' : 'bg-emerald-500'" :style="`width:${trendWidth(m)}%`"></span></span>
                      <span class="w-28 shrink-0 text-right font-mono" :class="m.profit < 0 ? 'text-rose-700' : 'text-stone-700'" x-text="signedMoney(m.profit) + (m.margin !== null ? ' · ' + m.margin + '%' : '')"></span></div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </section>

        <div x-show="detailTab === 'details'" x-transition.opacity>
        <!-- Long lists stay compact: the latest rows show here and the full list opens in the system help tip. -->
        <div class="space-y-4 mb-5" x-show="detailLists().length">
          <template x-for="block in detailLists()" :key="block.key">
            <section class="bg-white border border-[#E7DFCC] rounded-xl overflow-hidden">
              <div class="px-4 py-3 border-b border-[#E7DFCC] flex items-center justify-between gap-3">
                <h4 class="text-xs uppercase tracking-wider font-bold text-[#8f172d]" x-text="block.title"></h4>
                <span class="flex items-center gap-1.5 text-[10px] text-stone-400">
                  <span x-text="block.rows.length + (block.rows.length === 1 ? ' record' : ' records')"></span>
                  <span x-show="block.rows.length > 3" class="form-help-tip normal-case tracking-normal" data-form-help-tip data-form-help-portal="true">
                    <button type="button" class="form-help-tip__trigger" data-form-help-trigger :aria-label="'All ' + block.title.toLowerCase()" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8"></circle><path d="M10 9v5"></path><path d="M10 6.25h.01"></path></svg></button>
                    <span class="form-help-tip__bubble form-help-tip__bubble--portal normal-case tracking-normal" data-form-help-bubble role="tooltip" hidden>
                      <ul class="form-help-tip__list"><template x-for="(row, i) in block.rows" :key="i"><li class="form-help-tip__list-item"><strong class="form-help-tip__list-title" x-text="row.title"></strong><span class="form-help-tip__list-detail" x-text="row.detail"></span></li></template></ul>
                    </span>
                  </span>
                </span>
              </div>
              <ul class="px-4 py-1 divide-y divide-stone-100">
                <template x-for="(row, i) in block.rows.slice(0, 3)" :key="i"><li class="flex items-start justify-between gap-3 py-2 text-xs"><span class="font-semibold text-stone-700" x-text="row.title"></span><span class="text-right font-mono text-stone-500" x-text="row.detail"></span></li></template>
              </ul>
              <p x-show="!block.rows.length" class="px-4 py-5 text-center text-xs text-stone-400" x-text="block.empty"></p>
              <p x-show="block.rows.length > 3" class="px-4 pb-3 text-[10px] text-stone-400" x-text="'Latest 3 of ' + block.rows.length + ' shown. Use the info icon to see them all.'"></p>
              <p x-show="block.note" class="px-4 pb-3 text-[10px] text-stone-400" x-text="block.note"></p>
            </section>
          </template>
        </div>
        <!-- Raw material -->
        <template x-if="detail?.type === 'Raw material'">
          <div class="space-y-5">



          </div>
        </template>

        <!-- Finished good -->
        <template x-if="detail?.type === 'Finished good'">
          <div class="space-y-5">
            <section x-show="detail.channel_prices?.length" class="bg-white border border-[#E7DFCC] rounded-xl overflow-hidden">
              <div class="px-4 py-3 border-b border-[#E7DFCC]"><h4 class="text-xs uppercase tracking-wider font-bold text-[#8f172d]">Channel selling prices</h4></div>
              <div class="p-4 grid grid-cols-1 sm:grid-cols-3 gap-2">
                <template x-for="row in detail.channel_prices" :key="row.channel"><div class="border border-stone-100 rounded-lg p-3"><div class="text-[10px] uppercase tracking-wide font-bold text-stone-400" x-text="row.channel"></div><div class="font-mono font-semibold text-[#8f172d] mt-1" x-text="money(row.price)"></div></div></template>
              </div>
            </section>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <section x-show="detail.uses_production" class="bg-white border border-[#E7DFCC] rounded-xl overflow-hidden"><div class="px-4 py-3 border-b border-[#E7DFCC]"><h4 class="text-xs uppercase tracking-wider font-bold text-[#8f172d]">Production frequency by channel</h4></div><div class="p-4 space-y-2"><template x-for="row in detail.production_channels" :key="row.channel"><div class="flex items-center justify-between text-xs border-b border-stone-100 pb-2 gap-3"><span x-text="row.channel"></span><span class="font-mono text-right inline-flex items-center justify-end gap-1.5"><span x-text="fmt(row.units) + ' saleable • ' + row.production_events + ' event(s)' + (Number(row.excess_units || 0) > 0 ? ' • ' + fmt(row.excess_units) + ' surplus' : '') + (Number(row.outstanding_shortage_units || 0) > 0 ? ' • ' + fmt(row.outstanding_shortage_units) + ' shortage' : '')"></span><span class="form-help-tip normal-case tracking-normal" data-form-help-tip data-form-help-portal="true" x-show="Number(row.excess_units || 0) > 0"><button type="button" class="form-help-tip__trigger" data-form-help-trigger aria-label="Surplus breakdown" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8"></circle><path d="M10 9v5"></path><path d="M10 6.25h.01"></path></svg></button><span class="form-help-tip__bubble form-help-tip__bubble--portal normal-case tracking-normal" data-form-help-bubble role="tooltip" hidden><ul class="form-help-tip__list"><template x-for="(line, i) in excessLines(row)" :key="i"><li class="form-help-tip__list-item"><span class="form-help-tip__list-detail" x-text="line"></span></li></template></ul></span></span></span></div></template></div></section>
              <section class="bg-white border border-[#E7DFCC] rounded-xl overflow-hidden"><div class="px-4 py-3 border-b border-[#E7DFCC]"><h4 class="text-xs uppercase tracking-wider font-bold text-[#8f172d]">Sales by channel</h4></div><div class="p-4 space-y-2"><template x-for="row in detail.sales_channels" :key="row.channel"><div class="flex items-center justify-between text-xs border-b border-stone-100 pb-2"><span x-text="row.channel"></span><span class="font-mono" x-text="fmt(row.units) + ' units • ' + money(row.revenue)"></span></div></template></div></section>
            </div>

          </div>
        </template>

        <!-- Supplier -->
        <template x-if="detail?.type === 'Procurement vendor'">
          <div class="space-y-5">


          </div>
        </template>

        <!-- Customer -->
        <template x-if="detail?.type === 'Customer'">
          <div class="space-y-5">


          </div>
        </template>

        <!-- Region / group -->
        <template x-if="detail?.type === 'Customer region' || detail?.type === 'Customer group'">

        </template>
        </div>
      </div>

      <div class="px-5 py-3 border-t border-[#E7DFCC] bg-white flex justify-end">
        <button @click="closeDetail()" type="button" class="rounded-md bg-[#8f172d] hover:bg-[#4D1C25] text-white px-4 py-2 text-xs font-semibold">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
function dashboardSearch() {
  return {
    query: '',
    results: [],
    showResults: false,
    loading: false,
    detail: null,
    detailTab: 'overview',
    profitWindow: 0,
    currency: '{{ biz.currency_symbol|escapejs }}',

    detailTabs() {
      const tabs = [{key:'overview',label:'Overview'},{key:'activity',label:'Activity'}];
      if (this.detail?.type === 'Finished good' && this.detail?.profitability) tabs.push({key:'profit',label:'Profitability'});
      tabs.push({key:'details',label:'Details'});
      return tabs;
    },
    // Where surplus production went, kept out of the table cell and shown in a help tip.
    excessLines(row) {
      return [
        `Planned offcut: ${this.fmt(row.planned_offcut_units || 0)}`,
        `Additional excess: ${this.fmt(row.additional_excess_units || 0)}`,
        `To physical store stock: ${this.fmt(row.excess_stock_units || 0)}`,
        `To market stock: ${this.fmt(row.excess_market_stock_units || 0)}`,
        `To non-stock purpose: ${this.fmt(row.excess_non_stock_units || 0)}`,
      ];
    },
    detailLists() {
      const d = this.detail;
      if (!d) return [];
      const n = (v) => this.fmt(v);
      const list = (key, title, rows, empty, note) => ({ key, title, rows: rows || [], empty, note: note || '' });
      const blocks = [];
      if (d.type === 'Raw material') {
        blocks.push(list('price', 'Procurement price movement', (d.price_history || []).map(r => ({ title: `${r.date} · ${r.supplier || 'Unknown vendor'}`, detail: `${this.money(r.unit_cost)} / ${r.purchase_unit || 'unit'}` })), 'No procurement price history yet.'));
        blocks.push(list('dispense', 'Operational supply dispensing', (d.operational_dispenses || []).map(r => ({ title: `${r.date} · ${r.reason || 'Dispensed'}`, detail: `${n(r.quantity)} ${r.unit || ''}${r.description ? ' · ' + r.description : ''}${r.location ? ' · ' + r.location : ''}` })), 'No operational dispensing recorded.'));
        if (d.uses_production) blocks.push(list('links', `${d.recipe_label} / production links`, (d.linked_goods || []).map(r => ({ title: r.name, detail: `${n(r.qty_per_batch)} ${r.usage_unit || ''} / batch` })), 'Not used in any product yet.'));
      } else if (d.type === 'Finished good') {
        if (d.uses_production) blocks.push(list('recipe', `${d.recipe_label} / production cost`, (d.recipe || []).map(r => ({ title: r.name, detail: `${n(r.qty_per_batch)} ${r.unit || ''} / batch · ${this.money(r.current_cost)} each` })), 'No recipe set up.', d.note));
      } else if (d.type === 'Procurement vendor') {
        blocks.push(list('materials', 'Materials purchased from this vendor', (d.materials || []).map(r => ({ title: r.name, detail: this.money(r.spend) })), 'No materials purchased yet.'));
        blocks.push(list('purchases', 'Recent purchase history', (d.purchases || []).map(r => ({ title: `${r.date} · ${r.status}`, detail: `${this.money(r.total)}${(r.items || []).length ? ' · ' + r.items.map(i => i.name + ' × ' + n(i.qty)).join(', ') : ''}` })), 'No purchases yet.'));
      } else if (d.type === 'Customer') {
        blocks.push(list('orders', 'Order history', (d.orders || []).map(r => ({ title: `${r.date} · ${r.status}`, detail: `${this.money(r.total)} · ${n(r.units)} units${r.group ? ' · ' + r.group : ''}${r.region ? ' · ' + r.region : ''}` })), 'No orders yet.'));
        blocks.push(list('sales', 'Completed sales', (d.sales || []).map(r => ({ title: `${r.date}${r.payment ? ' · ' + r.payment : ''}`, detail: this.money(r.total) })), 'No completed sales yet.'));
      } else if (d.customers && d.customers.length) {
        blocks.push(list('customers', 'Customers in this segment', (d.customers || []).map(name => ({ title: name, detail: '' })), 'No customers in this segment.'));
      }
      return blocks;
    },
    currentProfitWindow() { return this.detail?.profitability?.windows?.[this.profitWindow] || null; },
    signedMoney(value) { const n = Number(value || 0); return (n < 0 ? '−' : '') + this.money(Math.abs(n)); },
    trendWidth(row) {
      const peak = Math.max(...(this.detail?.profitability?.trend || []).map(r => Math.abs(r.profit)), 1);
      return Math.round(Math.abs(row.profit) / peak * 1000) / 10;
    },

    async search() {
      const q = this.query.trim();
      this.showResults = !!q;
      if (q.length < 2) {
        this.results = [];
        return;
      }
      this.loading = true;
      try {
        const response = await fetch(`{% url 'dashboard_search' %}?q=${encodeURIComponent(q)}`, {
          headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        const data = await response.json();
        this.results = data.results || [];
      } catch (error) {
        console.error('Dashboard search failed:', error);
        this.results = [];
      } finally {
        this.loading = false;
      }
    },

    async open(result) {
      this.showResults = false;
      this.loading = true;
      this.detailTab = 'overview';
      this.profitWindow = 0;
      try {
        const url = new URL('{% url 'dashboard_search_detail' %}', window.location.origin);
        url.searchParams.set('type', result.type);
        if (result.type === 'raw' || result.type === 'fg') url.searchParams.set('id', result.key.split(':')[1]);
        if (result.type === 'record') { url.searchParams.set('id', result.key.split(':').at(-1)); url.searchParams.set('model', result.model); }
        if (result.type === 'customer') {
          url.searchParams.set('channel', result.channel);
          url.searchParams.set('value', result.label);
        }
        if (['supplier', 'region', 'group'].includes(result.type)) url.searchParams.set('value', result.label);
        const response = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
        if (!response.ok) throw new Error('Detail request failed');
        this.detail = await response.json();
      } catch (error) {
        console.error('Dashboard search detail failed:', error);
      } finally {
        this.loading = false;
      }
    },

    openFirst() {
      if (this.results.length) this.open(this.results[0]);
    },

    closeResults() { this.showResults = false; },
    closeDetail() { this.detail = null; },
    clear() { this.query = ''; this.results = []; this.showResults = false; },

    fmt(value) {
      return Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    },

    money(value) {
      return `${this.currency}${Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    },

    summaryCards() {
      const s = this.detail?.summary || {};
      const skip = new Set(['regions', 'groups', 'customers_sample', 'customers', 'stock_unit', 'reorder_unit']);
      if (this.detail?.type === 'Finished good' && !this.detail?.uses_production) {
        ['total_produced', 'delivered_to_customers', 'market_stock', 'expired_market_stock', 'market_transfer_shelf_allowance', 'units_per_batch'].forEach(key => skip.add(key));
      }
      const labels = {
        category: 'Category', cost_per_purchase_unit: 'Cost / purchase unit', last_purchase: 'Last purchase', supplier_count: 'Suppliers',
        total_produced: 'Total produced', delivered_to_customers: 'Delivered', selling_price: 'Default selling price',
        market_stock: 'Distribution Market Stock', expired_market_stock: 'Expired Market Stock', market_transfer_shelf_allowance: 'Market-origin shelf allowance',
        estimated_recipe_cost_per_unit: this.detail?.uses_production ? `Current ${this.detail.recipe_label.toLowerCase()} cost / unit` : 'Latest purchase cost / unit', estimated_margin_per_unit: 'Current est. margin / unit', margin_pct: 'Current est. margin %', units_per_batch: 'Units / batch',
        total_purchase: 'Total purchased', purchase_orders: 'Purchase orders', materials_bought: 'Materials bought', average_purchase: 'Average purchase',
        channel: 'Channel', orders: 'Orders', completed_orders: 'Completed', sales: 'Sales', revenue: 'Revenue', units: 'Units', last_order: 'Last order', last_sale: 'Last sale',
        latest_historical_unit_cost: 'Latest historical cost / unit', unpaid_product_value: 'Unpaid product value', unpaid_product_retail_value: 'Unpaid product value', unpaid_product_cost_value: 'Unpaid product cost', gross_profit: 'Gross profit',
      };
      const cards = [];
      if (s.stock !== undefined && s.stock !== null && s.stock_unit) cards.push({ label: 'Current stock', value: this.fmt(s.stock) + ' ' + s.stock_unit });
      if (s.reorder_level !== undefined && s.reorder_level !== null && s.reorder_unit) cards.push({ label: 'Reorder level', value: this.fmt(s.reorder_level) + ' ' + s.reorder_unit });
      if (s.physical_store_reorder_level !== undefined && s.physical_store_reorder_level !== null && s.reorder_unit) cards.push({ label: 'Physical-store reorder', value: this.fmt(s.physical_store_reorder_level) + ' ' + s.reorder_unit });
      for (const [key, value] of Object.entries(s)) {
        if (skip.has(key) || key === 'stock' || key === 'reorder_level' || key === 'physical_store_reorder_level') continue;
        cards.push({
          label: labels[key] || key.replaceAll('_', ' '),
          value: typeof value === 'number' && ['cost_per_purchase_unit','selling_price','estimated_recipe_cost_per_unit','estimated_margin_per_unit','total_purchase','average_purchase','revenue','latest_historical_unit_cost','unpaid_product_value','unpaid_product_retail_value','unpaid_product_cost_value','gross_profit'].includes(key) ? this.money(value) : (Array.isArray(value) ? value.join(', ') || '—' : String(value ?? '—'))
        });
      }
      return cards.slice(0, 8);
    }
  };
}
</script>
