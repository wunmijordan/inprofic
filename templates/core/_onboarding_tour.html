{% load static %}

<link rel="stylesheet" href="{% static 'core/css/onboarding-tour.css' %}?v={{ static_asset_version }}">

<div id="ip-onboarding-tour" class="ip-tour" hidden
     data-version="{{ onboarding_tour_version }}"
     data-force="{% if force_onboarding_tour %}1{% else %}0{% endif %}"
     data-complete-url="{% url 'onboarding_tour_complete' %}"
     data-vertical="{{ biz.vertical|default:'general' }}"
     data-uses-production="{% if vertical_ui.uses_production %}1{% else %}0{% endif %}"
     data-shipbubble-enabled="{{ shipbubble_platform_enabled|yesno:'true,false' }}"
     data-media-root="{% static 'core/tour/' %}">
  <div class="ip-tour-backdrop" aria-hidden="true"></div>
  <div class="ip-tour-focus" aria-hidden="true"></div>
  <section class="ip-tour-card" role="dialog" aria-modal="true" aria-labelledby="ip-tour-title" aria-describedby="ip-tour-body">
    <div id="ip-tour-art" class="ip-tour-art" data-kind="dashboard" aria-hidden="true">
      <div class="ip-tour-shape a"></div><div class="ip-tour-shape b"></div><div class="ip-tour-shape c"></div><div class="ip-tour-shape d"></div>
    </div>
    <div id="ip-tour-media" class="ip-tour-media" hidden aria-hidden="true"></div>
    <div class="ip-tour-copy flex items-start justify-between gap-3">
      <div>
        <p id="ip-tour-eyebrow" class="text-[10px] font-extrabold uppercase tracking-[.18em] text-stone-400">Getting Started</p>
        <h2 id="ip-tour-title" class="mt-1 font-display text-xl font-semibold text-[#8f172d]">Welcome to INPROFIC</h2>
      </div>
      <button type="button" id="ip-tour-skip-top" class="shrink-0 rounded-full px-2 py-1 text-xs text-stone-500 hover:bg-stone-100" aria-label="Skip tour">Skip</button>
    </div>
    <p id="ip-tour-body" class="mt-2 text-sm leading-6 text-stone-600"></p>
    <button type="button" id="ip-tour-cta-action" class="ip-tour-cta-action">Open this Section <span aria-hidden="true">→</span></button>
    <div class="mt-4 ip-tour-progress" role="progressbar" aria-label="Onboarding tour progress" aria-valuemin="1"><span id="ip-tour-progress"></span></div>
    <div class="mt-2 flex items-center justify-between gap-2 text-[11px] text-stone-400">
      <span id="ip-tour-counter"></span>
      <button type="button" id="ip-tour-never" class="font-semibold text-stone-500 underline decoration-stone-300 underline-offset-2 hover:text-[#8f172d]">Do not show again</button>
    </div>
    <div class="mt-4 flex items-center justify-between gap-2">
      <button data-button-surface type="button" id="ip-tour-prev" class="rounded-xl border px-4 py-2 text-sm font-semibold disabled:opacity-35">Previous</button>
      <button data-button-surface type="button" id="ip-tour-next" class="rounded-xl border px-5 py-2 text-sm font-semibold">Next</button>
    </div>
  </section>
</div>

<script src="{% static 'core/js/onboarding-tour.js' %}?v={{ static_asset_version }}" defer></script>
