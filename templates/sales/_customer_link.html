{% if customer_id and module_permissions.sales.view %}<a href="{% url 'customer_activity' customer_id %}{% if activity_start %}?start={{ activity_start|date:'Y-m-d' }}&amp;end={{ activity_end|date:'Y-m-d' }}{% endif %}" class="font-medium underline decoration-dotted underline-offset-4 hover:decoration-solid" aria-label="View activity for {{ customer_name }}">{{ customer_name }}</a>{% else %}{{ customer_name }}{% endif %}
