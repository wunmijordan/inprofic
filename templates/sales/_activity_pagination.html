{% if page.has_other_pages %}<nav class="mt-3 flex items-center gap-3 text-xs" aria-label="{{ label }} pages">
{% if page.has_previous %}<a class="workspace-action" href="?start={{ start|date:'Y-m-d' }}&amp;end={{ end|date:'Y-m-d' }}&amp;{{ parameter }}={{ page.previous_page_number }}#{{ anchor }}">Previous</a>{% endif %}
<span>{{ page.number }} of {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a class="workspace-action" href="?start={{ start|date:'Y-m-d' }}&amp;end={{ end|date:'Y-m-d' }}&amp;{{ parameter }}={{ page.next_page_number }}#{{ anchor }}">Next</a>{% endif %}
</nav>{% endif %}
