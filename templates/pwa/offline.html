{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050733">
  <title>INPROFIC · Offline</title>
  <link rel="stylesheet" href="{% static 'core/css/inprofic.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/workspace.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/interactions.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/form-experience.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/button-surfaces.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/offline-workspace.css' %}">
  <script>
    (() => {
      let choice;
      try { choice = localStorage.getItem('inprofic-theme'); } catch (_) {}
      document.documentElement.dataset.theme = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    })();
  </script>
  <script defer src="{% static 'core/js/form-experience.js' %}"></script>
  <script defer src="{% static 'core/js/offline-workspace.js' %}"></script>
</head>
<body class="offline-page">
  <main data-offline-workspace class="max-w-5xl mx-auto p-4 md:p-6">
    <section class="connection-fallback">
      <img class="connection-logo connection-logo-light" src="{% static 'core/brand/inprofic-wordmark-on-light.png' %}" alt="INPROFIC" width="230" height="45">
      <img class="connection-logo connection-logo-dark" src="{% static 'core/brand/inprofic-wordmark-on-dark.png' %}" alt="INPROFIC" width="230" height="45">
      <p class="connection-eyebrow">Connection unavailable</p>
      <h1>INPROFIC is offline</h1>
      <p>Reconnect to continue with live data, or unlock the offline packages prepared on this device.</p>
      <button type="button" class="workspace-action workspace-action-primary" onclick="location.reload()">Try again</button>
    </section>
  </main>
  {% include 'pwa/_connection_dialog.html' %}
</body>
</html>
