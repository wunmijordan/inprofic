{% load static %}
{% include "_brand_icons.html" %}
{% if user.is_authenticated and biz %}
  {% url 'pwa_manifest_tenant' business_slug=biz.slug as pwa_manifest_url %}
  <link id="inprofic-pwa-manifest" rel="manifest" href="{{ pwa_manifest_url }}?theme=light" data-base-href="{{ pwa_manifest_url }}" crossorigin="use-credentials">
{% else %}
  {% url 'pwa_manifest' as pwa_manifest_url %}
  <link id="inprofic-pwa-manifest" rel="manifest" href="{{ pwa_manifest_url }}?theme=light" data-base-href="{{ pwa_manifest_url }}">
{% endif %}
<link id="inprofic-apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="{% static 'core/pwa/icon-mark-180.png' %}" data-light-href="{% static 'core/pwa/icon-mark-180.png' %}" data-dark-href="{% static 'core/pwa/icon-mark-on-dark-180.png' %}">
<meta id="inprofic-theme-color" name="theme-color" content="#FFF1E8">
<script>
  (function () {
    // Single source of truth for launch theming. The in-app appearance choice
    // (Light / Dark / System, stored by workspace.js) wins over the operating
    // system; "System" or no choice follows the OS. Pages that do not load
    // workspace.js (e.g. the marketing site) still resolve correctly because
    // the stored choice is read directly.
    const root = document.documentElement;
    const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    const manifest = document.getElementById('inprofic-pwa-manifest');
    const touchIcon = document.getElementById('inprofic-apple-touch-icon');
    const themeColor = document.getElementById('inprofic-theme-color');
    const favicon = document.getElementById('inprofic-favicon');
    const resolveDark = function () {
      let choice = null;
      try { choice = window.localStorage.getItem('inprofic-theme'); } catch (_error) {}
      if (choice === 'dark') return true;
      if (choice === 'light') return false;
      return !!(media && media.matches);
    };
    let lastTheme = '';
    const syncLaunchTheme = function () {
      const dark = resolveDark();
      const theme = dark ? 'dark' : 'light';
      // Drives the in-page launch overlay (see <style> below).
      root.setAttribute('data-launch-theme', theme);
      if (themeColor) themeColor.setAttribute('content', dark ? '#050733' : '#FFF1E8');
      // Tab / window-frame icon follows the resolved app theme, not just the OS.
      if (favicon) favicon.href = dark ? favicon.dataset.darkHref : favicon.dataset.lightHref;
      // Remembered for the server: manifest requests (install and the browser's
      // later update checks) read it so splash colour and icon always match.
      try { document.cookie = 'inprofic_theme=' + theme + ';path=/;max-age=31536000;SameSite=Lax'; } catch (_error) {}
      if (theme === lastTheme) return;
      lastTheme = theme;
      const platform = navigator.userAgentData?.platform || navigator.platform || navigator.userAgent || '';
      const windows = /win/i.test(platform);
      if (manifest) {
        // Installed splash/title-bar colours and icon variant are read from the
        // manifest, so request the one matching the resolved theme. Windows
        // gets the same theme-matched colours; only its icon set differs.
        const separator = manifest.dataset.baseHref.includes('?') ? '&' : '?';
        manifest.href = `${manifest.dataset.baseHref}${separator}theme=${theme}${windows ? '&platform=windows' : ''}`;
      }
      if (touchIcon) touchIcon.href = dark ? touchIcon.dataset.darkHref : touchIcon.dataset.lightHref;
      if ('serviceWorker' in navigator) {
        const message = { type: 'INPROFIC_THEME', theme: theme };
        if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage(message);
        navigator.serviceWorker.ready.then(registration => registration.active?.postMessage(message)).catch(() => {});
      }
    };
    syncLaunchTheme();
    if (media) {
      if (media.addEventListener) media.addEventListener('change', syncLaunchTheme);
      else if (media.addListener) media.addListener(syncLaunchTheme);
    }
    // In-app theme switch (workspace.js updates data-theme) and other tabs.
    if (window.MutationObserver) new MutationObserver(syncLaunchTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
    window.addEventListener('storage', function (event) { if (event.key === 'inprofic-theme') syncLaunchTheme(); });
  }());
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{% if user.is_authenticated and biz %}{{ biz.name|truncatechars:30 }}{% else %}INPROFIC{% endif %}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html.pwa-launching,html.pwa-launching body{min-height:100%;overflow:hidden}
  html.pwa-launching body::before{content:"";position:fixed;inset:0;z-index:2147483646;background:#fff1e8 url("{% static 'core/brand/inprofic-wordmark-on-light.png' %}") center/ min(76vw,22rem) auto no-repeat;opacity:1;pointer-events:none;transition:opacity .38s ease}
  html.pwa-launching body::after{content:"Production to Commerce";position:fixed;z-index:2147483647;left:50%;top:calc(50% + 3.35rem);transform:translateX(-50%);width:min(86vw,28rem);color:#d14900;font-family:'Sora',system-ui,sans-serif;font-size:clamp(.68rem,2.8vw,.85rem);font-weight:800;letter-spacing:.12em;text-align:center;text-transform:uppercase;opacity:1;pointer-events:none;transition:opacity .38s ease}
  html.pwa-launching.pwa-launch-fading body::before,html.pwa-launching.pwa-launch-fading body::after{opacity:0}
  html[data-launch-theme="dark"].pwa-launching body::before{background-color:#050733;background-image:url("{% static 'core/brand/inprofic-wordmark-on-dark.png' %}")}
  html[data-launch-theme="dark"].pwa-launching body::after{color:#f2782d}
  @media(prefers-reduced-motion:reduce){
    html.pwa-launching body::before,html.pwa-launching body::after{transition:none}
  }
</style>
<script>
  (function () {
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!standalone) return;
    const key = 'inprofic:pwa-launch-shown';
    try { if (window.sessionStorage.getItem(key)) return; } catch (_error) {}
    document.documentElement.classList.add('pwa-launching');
    const finish = function () {
      window.setTimeout(function () {
        document.documentElement.classList.add('pwa-launch-fading');
        window.setTimeout(function () {
          document.documentElement.classList.remove('pwa-launching', 'pwa-launch-fading');
          try { window.sessionStorage.setItem(key, '1'); } catch (_error) {}
        }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 400);
      }, 2000);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', finish, { once: true });
    else finish();
  }());
</script>
<link rel="stylesheet" href="{% static 'core/pwa/install.css' %}">
