{% comment %}Include once on pages whose JavaScript draws vehicle icons. Clones the same artwork the server renders.{% endcomment %}<template id="vehicle-icon-motorbike">{% include "commerce/delivery/_vehicle_icon.html" with mode="motorbike" size="h-4 w-4" %}</template><template id="vehicle-icon-car">{% include "commerce/delivery/_vehicle_icon.html" with mode="car" size="h-4 w-4" %}</template><script>window.vehicleIcon=function(mode,cls){var t=document.getElementById("vehicle-icon-"+(mode==="car"?"car":"motorbike"));var n=t.content.firstElementChild.cloneNode(true);if(cls)n.setAttribute("class",cls+" inline-block shrink-0");return n;};</script>
