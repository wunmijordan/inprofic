<div class="location-picker mt-2 rounded-lg border border-stone-200 bg-stone-50 p-3"
     data-location-picker
     data-latitude-input="{{ latitude_selector }}"
     data-longitude-input="{{ longitude_selector }}">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <div><p class="text-xs font-semibold text-stone-800">Map location</p><p class="text-[11px] leading-4 text-stone-500">Place the pin for this {{ picker_label|default:'location' }}. Coordinates remain editable above.</p></div>
    <button type="button" data-map-toggle aria-expanded="false" class="rounded-md border border-stone-300 bg-white px-3 py-2 text-xs font-semibold text-stone-700">Choose on map</button>
  </div>
  <div data-map-panel hidden class="mt-3">
    <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
      <p data-map-status class="text-[11px] text-stone-500" aria-live="polite">Click the map or use your current location.</p>
      <div class="flex items-center gap-1">
        <button type="button" data-map-locate class="rounded border border-stone-300 bg-white px-2 py-1.5 text-[11px] font-semibold text-stone-700">Use my location</button>
        <button type="button" data-map-zoom-out class="h-8 w-8 rounded border border-stone-300 bg-white text-sm font-bold text-stone-700" aria-label="Zoom out">−</button>
        <button type="button" data-map-zoom-in class="h-8 w-8 rounded border border-stone-300 bg-white text-sm font-bold text-stone-700" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div data-map-canvas class="location-picker-canvas" role="application" tabindex="0" aria-label="Map selector for {{ picker_label|default:'location' }}. Use the arrow keys to move the pin and plus or minus to zoom.">
      <div data-map-tiles class="location-picker-tiles" aria-hidden="true"></div>
      <span class="location-picker-pin" aria-hidden="true"></span>
    </div>
    <p class="mt-1 text-[10px] text-stone-400">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" class="underline">OpenStreetMap contributors</a></p>
  </div>
</div>
<style>
  .location-picker-canvas{position:relative;height:17rem;max-height:42vh;overflow:hidden;border:1px solid var(--ui-border,#d6d3d1);border-radius:.5rem;background:#dbe4ec;cursor:crosshair;touch-action:none}
  .location-picker-tiles{position:absolute;inset:0;overflow:hidden}.location-picker-tiles img{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none}
  .location-picker-pin{position:absolute;left:50%;top:50%;z-index:2;width:1.05rem;height:1.05rem;border:3px solid white;border-radius:50% 50% 50% 0;background:var(--ui-accent,var(--brand,#d14900));box-shadow:0 3px 9px rgba(15,23,42,.45);transform:translate(-50%,-100%) rotate(-45deg);pointer-events:none}
  @media(max-width:640px){.location-picker-canvas{height:14rem}}
</style>
