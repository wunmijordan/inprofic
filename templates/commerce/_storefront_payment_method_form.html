<form method="post" action="{% url 'storefront_checkout_payment' store_business.slug checkout.public_id %}" class="rounded-xl border border-stone-200 bg-white p-3 shadow-sm">
  {% csrf_token %}
  <input type="hidden" name="method" value="{{ method.code }}">
  <input type="hidden" name="payment_key" value="{{ payment_key }}">
  {% if method.code == 'transfer' and method.routes %}
    <label class="mb-3 block text-xs font-semibold text-stone-600">Transfer to
      <select name="transfer_route_id" required class="mt-1.5 h-10 w-full rounded-lg border border-stone-300 bg-white px-3 text-sm font-normal outline-none focus:border-stone-500 focus:ring-4 focus:ring-stone-100">
        {% for route in method.routes %}<option value="{{ route.id }}">{{ route.name }} · {{ route.bank_name }} · {{ route.account_number }}</option>{% endfor %}
      </select>
    </label>
  {% endif %}
  {% if not checkout.customer_email %}
    {% if method.code == 'paystack' or method.code == 'monnify' %}
    <label class="mb-3 block text-xs font-semibold text-stone-600">
      Email for {{ method.label }}
      <input name="payment_email" type="email" required autocomplete="email" placeholder="you@example.com" class="mt-1.5 h-10 w-full rounded-lg border border-stone-300 px-3 text-sm font-normal outline-none focus:border-stone-500 focus:ring-4 focus:ring-stone-100">
      <span class="mt-1 block font-normal leading-4 text-stone-400">Required by this payment provider only.</span>
    </label>
    {% endif %}
  {% endif %}
  <button class="flex w-full items-center justify-between rounded-lg px-1 py-1 text-left text-sm font-semibold text-stone-900 transition hover:text-stone-600">
    <span>{{ method.label }}</span><span aria-hidden="true">→</span>
  </button>
</form>
