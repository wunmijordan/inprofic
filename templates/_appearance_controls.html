<div class="appearance-controls">
  <p class="appearance-label">Mode</p>
  <div class="mt-2 grid grid-cols-3 gap-1.5">
    <button type="button" class="appearance-option rounded-md border border-stone-200 px-2 py-1.5 text-xs" data-theme-choice="light">Light</button>
    <button type="button" class="appearance-option rounded-md border border-stone-200 px-2 py-1.5 text-xs" data-theme-choice="dark">Dark</button>
    <button type="button" class="appearance-option rounded-md border border-stone-200 px-2 py-1.5 text-xs" data-theme-choice="system">System</button>
  </div>

  <p class="appearance-label mt-4">Action colour</p>
  <div class="appearance-swatches mt-2" aria-label="Action colour palette">
    <button type="button" class="appearance-swatch" data-accent-choice="tenant" title="{{ biz.name|default:'Business' }} action colour"><span class="sr-only">{{ biz.name|default:'Business' }} action colour</span></button>
    <button type="button" class="appearance-swatch" data-accent-choice="tenantSoft" title="{{ biz.name|default:'Business' }} soft action colour"><span class="sr-only">{{ biz.name|default:'Business' }} soft action colour</span></button>
    <button type="button" class="appearance-swatch" data-accent-choice="tenantDeep" title="{{ biz.name|default:'Business' }} deep action colour"><span class="sr-only">{{ biz.name|default:'Business' }} deep action colour</span></button>
    <button type="button" class="appearance-swatch" data-accent-choice="inprofic" title="INPROFIC ember"><span class="sr-only">INPROFIC ember</span></button>
    <button type="button" class="appearance-swatch" data-accent-choice="inproficSoft" title="INPROFIC soft ember"><span class="sr-only">INPROFIC soft ember</span></button>
    <button type="button" class="appearance-swatch" data-accent-choice="inproficDeep" title="INPROFIC deep ember"><span class="sr-only">INPROFIC deep ember</span></button>
    <button type="button" class="appearance-swatch" data-accent-choice="inproficWine" title="INPROFIC wine"><span class="sr-only">INPROFIC wine</span></button>
    <button type="button" class="appearance-swatch" data-accent-choice="inproficNavy" title="INPROFIC blue"><span class="sr-only">INPROFIC blue</span></button>
  </div>

  <p class="appearance-label mt-4">Dark-mode canvas</p>
  <label class="mt-2 flex w-full cursor-pointer items-center justify-between gap-3 rounded-md border border-stone-200 px-3 py-2 text-left text-xs">
    <span><strong class="block">Use default dark canvas</strong><span class="mt-0.5 block text-[10px] leading-4 text-stone-500">Keeps the page explicitly dark without changing card colour.</span></span>
    <span class="cf-switch shrink-0"><input type="checkbox" data-dark-canvas-toggle><span class="cf-switch-track"><span class="cf-switch-thumb"></span></span></span>
  </label>

  <p class="appearance-label mt-4">Dark-mode card colour</p>
  <div class="appearance-swatches mt-2" aria-label="Dark-mode card and surface colour palette">
    <button type="button" class="background-swatch" data-background-choice="tenant" title="{{ biz.name|default:'Business' }} surface colour"><span class="sr-only">{{ biz.name|default:'Business' }} surface colour</span></button>
    <button type="button" class="background-swatch" data-background-choice="tenantSoft" title="{{ biz.name|default:'Business' }} soft surface colour"><span class="sr-only">{{ biz.name|default:'Business' }} soft surface colour</span></button>
    <button type="button" class="background-swatch" data-background-choice="tenantDeep" title="{{ biz.name|default:'Business' }} deep surface colour"><span class="sr-only">{{ biz.name|default:'Business' }} deep surface colour</span></button>
    <button type="button" class="background-swatch" data-background-choice="inprofic" title="INPROFIC midnight"><span class="sr-only">INPROFIC midnight</span></button>
    <button type="button" class="background-swatch" data-background-choice="inproficSoft" title="INPROFIC soft midnight"><span class="sr-only">INPROFIC soft midnight</span></button>
    <button type="button" class="background-swatch" data-background-choice="inproficDeep" title="INPROFIC deep midnight"><span class="sr-only">INPROFIC deep midnight</span></button>
  </div>
  <p class="mt-2 text-[10px] leading-4 text-stone-500">The selected colour is used directly on cards. Turn off the default canvas to let the page background follow this palette too.</p>
</div>
