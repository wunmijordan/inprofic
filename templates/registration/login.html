{% load static %}
<!doctype html>
<html lang="en" data-tenant="global" data-tenant-accent="#D14900" data-tenant-background="#050733" style="--tenant-background:#050733;--tenant-background-contrast:#fff;--tenant-button:#D14900;--tenant-button-contrast:#fff">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — INPROFIC</title>
  <link rel="stylesheet" href="{% static 'core/css/inprofic.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/form-experience.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/workspace.css' %}">
  <script src="{% static 'core/js/workspace.js' %}"></script>
  {% include "pwa/head.html" %}
  <style>
    @font-face { font-family:'Sora'; src:url('{% static "core/fonts/Sora-Variable.ttf" %}') format('truetype'); font-weight:100 800; font-style:normal; font-display:swap; }
    @font-face { font-family:'Fraunces'; src:url('{% static "core/fonts/Fraunces-SemiBold.ttf" %}') format('truetype'); font-weight:500 700; font-style:normal; font-display:swap; }
    @font-face { font-family:'IBM Plex Mono'; src:url('{% static "core/fonts/IBMPlexMono-Regular.ttf" %}') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:'IBM Plex Mono'; src:url('{% static "core/fonts/IBMPlexMono-Medium.ttf" %}') format('truetype'); font-weight:500 700; font-style:normal; font-display:swap; }
    body { font-family: 'Sora', sans-serif; background:#FAF6EF; color:#211D1A; }
    .auth-logo-dark { display:none; }
    html[data-theme="dark"] .auth-logo-light { display:none; }
    html[data-theme="dark"] .auth-logo-dark { display:block; }
    .font-display { font-family: 'Fraunces', serif; }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }
    table { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    @media (min-width: 1024px) {
      .desktop-sidebar { position: fixed; inset: 0 auto 0 0; width: 14rem; height: 100vh; overflow-y: auto; scrollbar-width: none; z-index: 50; }
      .desktop-sidebar::-webkit-scrollbar { width: 0; height: 0; }
      .desktop-main { margin-left: 14rem; min-height: 100vh; }
    }
  </style>
  <script src="{% static 'core/js/form-experience.js' %}" defer></script>
</head>
<body>
<main class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-[#FFFDF8] border border-[#E7DFCC] rounded-xl p-6" style="box-shadow:var(--ui-shadow-raised)">
    <img src="{% static 'core/brand/inprofic-wordmark-on-light.png' %}" alt="INPROFIC" class="auth-logo-light max-w-full" style="width:12rem;height:auto" width="1944" height="309">
    <img src="{% static 'core/brand/inprofic-wordmark-on-dark.png' %}" alt="INPROFIC" class="auth-logo-dark max-w-full" style="width:12rem;height:auto" width="1827" height="290">
    <div class="text-[10px] tracking-[0.2em] uppercase text-[#C69A3E] mb-1">Production to commerce</div>
    <h1 class="text-xl font-semibold font-display text-[#d14900] mb-4">Sign In</h1>
    {% if form.errors %}
      <div class="text-sm bg-rose-50 text-rose-700 border border-rose-200 rounded-md px-3 py-2 mb-3">Incorrect username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="block mb-3">
        <span class="block text-xs font-medium text-stone-600 mb-1">Username</span>
        <input type="text" name="username" required autofocus autocomplete="username" class="w-full rounded-md border border-[#D9CFB4] bg-white px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#d14900]/30 focus:border-[#d14900]">
      </label>
      <label class="block mb-4">
        <span class="block text-xs font-medium text-stone-600 mb-1">Password</span>
        <input type="password" name="password" required autocomplete="current-password" class="w-full rounded-md border border-[#D9CFB4] bg-white px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#d14900]/30 focus:border-[#d14900]">
      </label>
      <button type="submit" class="w-full bg-[#d14900] text-white rounded-md py-2 text-sm font-medium hover:bg-[#050733]">Sign In</button>
    </form>
    <p class="text-xs text-center text-stone-500 mt-4">Starting a new Business Workspace? <a class="text-[#d14900] underline" href="{% url 'signup' %}">Sign Up</a></p>
    <p class="mt-2 text-center text-xs"><a class="text-stone-400 underline underline-offset-2 hover:text-[#d14900]" href="{% url 'marketing_home' %}">Back to the INPROFIC Overview</a></p>
  </div>
</main>
  {% include "pwa/install_prompt.html" %}
</body>
</html>
