name: Workspace UI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          INPROFIC_UI_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
